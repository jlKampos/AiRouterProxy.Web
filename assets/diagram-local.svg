<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 470" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Local workflow: coding agent through AiRouterProxy to two models">
  <defs>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181b26"/><stop offset="1" stop-color="#12141c"/>
    </linearGradient>
    <linearGradient id="gReq" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ea1ff"/><stop offset="1" stop-color="#2e7bff"/>
    </linearGradient>
    <linearGradient id="gRes" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4a7"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="gProxy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2131"/><stop offset="1" stop-color="#12141d"/>
    </linearGradient>
    <marker id="aReq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ea1ff"/>
    </marker>
    <marker id="aRes" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4a7"/>
    </marker>
    <marker id="aUp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4a7"/>
    </marker>
  </defs>

  <!-- ======= agent node ======= -->
  <g>
    <rect x="28" y="120" width="215" height="130" rx="16" fill="url(#gCard)" stroke="rgba(255,255,255,0.09)"/>
    <rect x="28" y="120" width="215" height="3" rx="2" fill="#4ea1ff"/>
    <text x="52" y="152" font-family="'Inter',system-ui,sans-serif" font-size="15" font-weight="800" fill="#e8ecf4">Your coding agent</text>
    <text x="52" y="172" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#9aa3b5">OpenCode · Cursor · Claude Code</text>
    <text x="52" y="206" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#5c6577">sends the prompt</text>
    <circle cx="52" cy="136" r="4" fill="#4ea1ff"/>
  </g>

  <!-- ======= request arrow: agent -&gt; proxy ======= -->
  <g>
    <path d="M243,190 L340,190" stroke="url(#gReq)" stroke-width="2.5" fill="none" marker-end="url(#aReq)" stroke-linecap="round"/>
    <text x="262" y="176" font-family="'JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#22d3ee">HTTPS · :4000</text>
    <text x="262" y="206" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#5c6577">TLS · local only</text>
  </g>

  <!-- ======= proxy hexagon ======= -->
  <g>
    <path d="M490,20 L637,105 L637,275 L490,360 L343,275 L343,105 Z"
          fill="url(#gProxy)" stroke="rgba(78,161,255,0.5)" stroke-width="1.5"/>
    <text x="490" y="70" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="16" font-weight="800" fill="#e8ecf4">AiRouterProxy</text>
    <text x="490" y="88" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#5c6577">https://0.0.0.0:4000</text>

    <!-- layer chips -->
    <g font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5">
      <rect x="416" y="112" width="148" height="22" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
      <circle cx="428" cy="123" r="3.4" fill="#22d3ee"/>
      <text x="442" y="127" fill="#9aa3b5">rate limit · IP</text>

      <rect x="416" y="140" width="148" height="22" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
      <circle cx="428" cy="151" r="3.4" fill="#b48bfa"/>
      <text x="442" y="155" fill="#9aa3b5">Bearer · multi-key</text>

      <rect x="416" y="168" width="148" height="22" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
      <circle cx="428" cy="179" r="3.4" fill="#f5a623"/>
      <text x="442" y="183" fill="#9aa3b5">inspection · fail-closed</text>

      <rect x="416" y="196" width="148" height="22" rx="7" fill="rgba(255,255,255,0.06)" stroke="rgba(78,161,255,0.4)"/>
      <circle cx="428" cy="207" r="3.4" fill="#4ea1ff"/>
      <text x="442" y="211" fill="#e8ecf4">redaction · ••••••</text>

      <rect x="416" y="224" width="148" height="22" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
      <circle cx="428" cy="235" r="3.4" fill="#2dd4a7"/>
      <text x="442" y="239" fill="#9aa3b5">route · routes.json</text>

      <rect x="416" y="252" width="148" height="22" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
      <circle cx="428" cy="263" r="3.4" fill="#22c55e"/>
      <text x="442" y="267" fill="#9aa3b5">SSE streaming</text>
    </g>
  </g>

  <!-- ======= request arrow: proxy -&gt; AI Router ======= -->
  <g>
    <path d="M637,190 L847,190" stroke="url(#gReq)" stroke-width="2.5" fill="none" marker-end="url(#aReq)" stroke-linecap="round"/>
    <text x="656" y="176" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#22d3ee">POST /v1/chat/completions</text>
    <rect x="652" y="210" width="188" height="21" rx="10" fill="rgba(78,161,255,0.10)" stroke="rgba(78,161,255,0.35)"/>
    <text x="666" y="225" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#e8ecf4">Authorization: Bearer <tspan fill="#4ea1ff">sk-••••••</tspan></text>
  </g>

  <!-- ======= AI Router node ======= -->
  <g>
    <rect x="850" y="120" width="190" height="130" rx="16" fill="url(#gCard)" stroke="rgba(255,255,255,0.09)"/>
    <rect x="850" y="120" width="190" height="3" rx="2" fill="#b48bfa"/>
    <text x="874" y="152" font-family="'Inter',system-ui,sans-serif" font-size="15" font-weight="800" fill="#e8ecf4">AI Router</text>
    <text x="874" y="172" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#9aa3b5">api.airrouter.ch</text>
    <text x="874" y="206" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#5c6577">pick · load-balance</text>
    <circle cx="874" cy="136" r="4" fill="#b48bfa"/>
  </g>

  <!-- ======= request arrows: AI Router -&gt; models ======= -->
  <g>
    <path d="M1040,140 C1070,140 1070,95 1096,95" stroke="url(#gReq)" stroke-width="2.5" fill="none" marker-end="url(#aReq)" stroke-linecap="round"/>
    <path d="M1040,210 C1070,210 1070,205 1096,205" stroke="url(#gReq)" stroke-width="2.5" fill="none" marker-end="url(#aReq)" stroke-linecap="round"/>
  </g>

  <!-- ======= model cards ======= -->
  <g>
    <rect x="1096" y="56" width="180" height="82" rx="14" fill="url(#gCard)" stroke="rgba(255,255,255,0.09)"/>
    <circle cx="1116" cy="78" r="4" fill="#4ea1ff"/>
    <text x="1130" y="83" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#e8ecf4">DeepSeek-V4-Flash</text>
    <text x="1116" y="110" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#5c6577">chat · SSE stream</text>

    <rect x="1096" y="166" width="180" height="82" rx="14" fill="url(#gCard)" stroke="rgba(255,255,255,0.09)"/>
    <circle cx="1116" cy="188" r="4" fill="#2dd4a7"/>
    <text x="1130" y="193" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#e8ecf4">Qwen3.8</text>
    <text x="1116" y="220" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#5c6577">chat · embed · whisper</text>
  </g>

  <!-- ======= response arrow (SSE) ======= -->
  <g>
    <path d="M1120,260 L1120,380 L150,380 L150,252" stroke="url(#gRes)" stroke-width="2.5" fill="none" marker-end="url(#aUp)" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="470" y="370" width="350" height="20" rx="10" fill="rgba(11,13,19,0.97)" stroke="rgba(45,212,167,0.25)"/>
    <text x="645" y="384" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#2dd4a7">streamed response · SSE · notice injected</text>
  </g>

  <!-- ======= legend ======= -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="11">
    <circle cx="40" cy="436" r="4" fill="#4ea1ff"/>
    <text x="52" y="440" fill="#9aa3b5">request path</text>
    <circle cx="170" cy="436" r="4" fill="#2dd4a7"/>
    <text x="182" y="440" fill="#9aa3b5">response path</text>
    <text x="330" y="440" fill="#5c6577">one local client · one or two models</text>
  </g>
</svg>
