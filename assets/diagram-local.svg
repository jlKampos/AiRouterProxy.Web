<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Local workflow: one coding agent through AiRouterProxy into multiple routes (AI Router, OpenRouter and Anthropic)">
  <defs>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181b26"/><stop offset="1" stop-color="#12141c"/>
    </linearGradient>
    <linearGradient id="gReq" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ea1ff"/><stop offset="1" stop-color="#2e7bff"/>
    </linearGradient>
    <linearGradient id="gRes" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4a7"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="gProxy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2131"/><stop offset="1" stop-color="#12141d"/>
    </linearGradient>
    <clipPath id="clipAgent"><rect x="28" y="120" width="215" height="130" rx="16"/></clipPath>
    <clipPath id="clipUpstreamA"><rect x="958" y="118" width="250" height="96" rx="14"/></clipPath>
    <clipPath id="clipUpstreamB"><rect x="958" y="384" width="250" height="96" rx="14"/></clipPath>
    <clipPath id="clipUpstreamC"><rect x="958" y="251" width="250" height="96" rx="14"/></clipPath>
    <marker id="aReq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ea1ff"/>
    </marker>
    <marker id="aRes" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4a7"/>
    </marker>
    <marker id="aUp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4a7"/>
    </marker>
  </defs>

<!-- ======= agent node ======= -->
<g>
  <rect x="28" y="120" width="215" height="130" rx="16"
        fill="url(#gCard)"
        stroke="rgba(255,255,255,0.09)"/>

  <rect x="28" y="120" width="215" height="3"
        fill="#4ea1ff"
        clip-path="url(#clipAgent)"/>

  <!-- Title bullet -->
  <circle cx="52" cy="142" r="4" fill="#4ea1ff"/>

  <!-- Title -->
  <text x="66" y="147"
        font-family="'Inter',system-ui,sans-serif"
        font-size="15"
        font-weight="800"
        fill="#e8ecf4">
    Your coding agent
  </text>

  <!-- Subtitle -->
  <text x="52" y="172"
        font-family="'JetBrains Mono',Consolas,monospace"
        font-size="10.5"
        fill="#9aa3b5">
    OpenCode · Cursor · Claude Code
  </text>

  <!-- Description -->
  <text x="52" y="206"
        font-family="'JetBrains Mono',Consolas,monospace"
        font-size="10.5"
        fill="#5c6577">
    sends the prompt
  </text>
</g>

  <!-- ======= request arrow: agent -&gt; proxy ======= -->
  <g>
    <path d="M243,190 L340,190" stroke="#4ea1ff" stroke-width="2.5" fill="none" marker-end="url(#aReq)" stroke-linecap="round"/>
    <text x="250" y="176" font-family="'JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#22d3ee">HTTPS · :4000</text>
    <text x="247" y="210" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#5c6577">TLS · local only</text>
  </g>

  <!-- ======= proxy hexagon ======= -->
  <g>
    <path d="M490,20 L637,105 L637,275 L490,360 L343,275 L343,105 Z"
          fill="url(#gProxy)" stroke="rgba(78,161,255,0.5)" stroke-width="1.5"/>
    <text x="490" y="80" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="16" font-weight="800" fill="#e8ecf4">AiRouterProxy</text>
    <text x="490" y="95" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#5c6577">https://0.0.0.0:4000</text>

    <!-- layer chips -->
    <g font-family="'JetBrains Mono',Consolas,monospace" font-size="10">
      <rect x="416" y="112" width="168" height="22" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
      <circle cx="428" cy="123" r="3.4" fill="#22d3ee"/>
      <text x="442" y="127" fill="#9aa3b5">rate limit · IP</text>

      <rect x="416" y="140" width="168" height="22" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
      <circle cx="428" cy="151" r="3.4" fill="#b48bfa"/>
      <text x="442" y="155" fill="#9aa3b5">Bearer · multi-key</text>

      <rect x="416" y="168" width="168" height="22" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
      <circle cx="428" cy="179" r="3.4" fill="#f5a623"/>
      <text x="442" y="183" fill="#9aa3b5">inspection · fail-closed</text>

      <rect x="416" y="196" width="168" height="22" rx="7" fill="rgba(255,255,255,0.06)" stroke="rgba(78,161,255,0.4)"/>
      <circle cx="428" cy="207" r="3.4" fill="#4ea1ff"/>
      <text x="442" y="211" fill="#e8ecf4">redaction · ••••••</text>

      <rect x="416" y="224" width="168" height="22" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
      <circle cx="428" cy="235" r="3.4" fill="#2dd4a7"/>
      <text x="442" y="239" fill="#9aa3b5">route · routes.json</text>

      <rect x="416" y="252" width="168" height="22" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)"/>
      <circle cx="428" cy="263" r="3.4" fill="#22c55e"/>
      <text x="442" y="267" fill="#9aa3b5">SSE streaming</text>
    </g>
  </g>

  <!-- ======= request arrows: proxy -&gt; upstreams (mirrors enterprise) ======= -->
  <g fill="none">
    <path d="M637,155 C720,155 780,166 955,166" stroke="url(#gReq)" stroke-width="2.2" marker-end="url(#aReq)" stroke-linecap="round"/>
    <path d="M637,215 C720,215 780,300 955,300" stroke="url(#gReq)" stroke-width="2.2" marker-end="url(#aReq)" stroke-linecap="round"/>
    <path d="M637,275 C720,275 780,420 955,420" stroke="url(#gReq)" stroke-width="2.2" marker-end="url(#aReq)" stroke-linecap="round"/>
  </g>
  <g font-family="'JetBrains Mono',Consolas,monospace">
    <rect x="680" y="182" width="110" height="20" rx="9" fill="#1a2942" stroke="rgba(78,161,255,0.35)"/>
    <text x="691" y="196" font-size="9.5" fill="#4ea1ff">default route</text>
    <rect x="680" y="242" width="110" height="20" rx="9" fill="#33221c" stroke="rgba(217,119,87,0.35)"/>
    <text x="691" y="256" font-size="9.5" fill="#d97757">/anthropic</text>
    <rect x="680" y="300" width="110" height="20" rx="9" fill="#143329" stroke="rgba(45,212,167,0.35)"/>
    <text x="691" y="314" font-size="9.5" fill="#2dd4a7">/openrouter</text>
  </g>

  <!-- ======= upstream cards (same output as enterprise) ======= -->
  <g>
    <!-- AI Router -->
    <rect x="958" y="118" width="250" height="96" rx="14" fill="url(#gCard)" stroke="rgba(255,255,255,0.09)"/>
    <rect x="958" y="118" width="250" height="3" fill="#4ea1ff" clip-path="url(#clipUpstreamA)"/>
    <circle cx="980" cy="140" r="4" fill="#4ea1ff"/>
    <text x="994" y="145" font-family="'Inter',system-ui,sans-serif" font-size="14" font-weight="800" fill="#e8ecf4">AI Router</text>
    <text x="1083" y="170" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#9aa3b5">api.airouter.ch</text>
    <text x="1083" y="186" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#5c6577">route key · pick · fallback</text>
    <text x="1083" y="202" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#5c6577">DeepSeek-V4-Flash · Qwen3.8 …</text>

    <!-- OpenRouter -->
    <rect x="958" y="384" width="250" height="96" rx="14" fill="url(#gCard)" stroke="rgba(255,255,255,0.09)"/>
    <rect x="958" y="384" width="250" height="3" fill="#2dd4a7" clip-path="url(#clipUpstreamB)"/>
    <circle cx="980" cy="406" r="4" fill="#2dd4a7"/>
    <text x="994" y="411" font-family="'Inter',system-ui,sans-serif" font-size="14" font-weight="800" fill="#e8ecf4">OpenRouter</text>
    <text x="1083" y="436" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#9aa3b5">openrouter.ai/api</text>
    <text x="1083" y="452" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#5c6577">route key · 100+ models</text>

    <!-- Anthropic -->
    <rect x="958" y="251" width="250" height="96" rx="14" fill="url(#gCard)" stroke="rgba(255,255,255,0.09)"/>
    <rect x="958" y="251" width="250" height="3" fill="#d97757" clip-path="url(#clipUpstreamC)"/>
    <circle cx="980" cy="273" r="4" fill="#d97757"/>
    <text x="994" y="278" font-family="'Inter',system-ui,sans-serif" font-size="14" font-weight="800" fill="#e8ecf4">Anthropic</text>
    <text x="1083" y="303" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#9aa3b5">api.anthropic.com</text>
    <text x="1083" y="319" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#5c6577">Claude Haiku · Sonnet</text>
    <text x="1083" y="335" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#5c6577">route key · anthropic-version</text>
  </g>

  <!-- ======= response lane (SSE) ======= -->
  <g>
    <path d="M1140,486 L1140,520 L150,520 L150,252" stroke="url(#gRes)" stroke-width="2.5" fill="none" marker-end="url(#aUp)" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="470" y="510" width="350" height="20" rx="10" fill="rgba(11,13,19,0.97)" stroke="rgba(45,212,167,0.25)"/>
    <text x="645" y="524" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#2dd4a7">streamed response · SSE · notice injected</text>
  </g>

  <!-- ======= legend ======= -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="11">
    <circle cx="40" cy="544" r="4" fill="#4ea1ff"/>
    <text x="52" y="548" fill="#9aa3b5">request path</text>
    <circle cx="170" cy="544" r="4" fill="#2dd4a7"/>
    <text x="182" y="548" fill="#9aa3b5">response path</text>
    <text x="330" y="548" fill="#5c6577">one local client · one gateway · many models across different routes</text>
  </g>
</svg>
